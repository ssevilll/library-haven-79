<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Verify Email — Lumen Library</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/site/css/styles.css" rel="stylesheet"/>
</head>
<body>
<div id="navbar-mount"></div>
<div class="auth-shell">
  <div class="auth-card text-center">
    <h2>Verify your email.</h2>
    <div class="sub">We sent a 6-digit code to <strong id="email-ph">your inbox</strong>. Enter it below. <br/><span class="text-muted-2 small">(demo code: <code>123456</code>)</span></div>
    <form onsubmit="event.preventDefault();doVerify()">
      <div class="code-inputs my-4" id="code-inputs">
        <input inputmode="numeric" maxlength="1" required/>
        <input inputmode="numeric" maxlength="1" required/>
        <input inputmode="numeric" maxlength="1" required/>
        <input inputmode="numeric" maxlength="1" required/>
        <input inputmode="numeric" maxlength="1" required/>
        <input inputmode="numeric" maxlength="1" required/>
      </div>
      <button class="btn btn-accent w-100" id="btn">Verify</button>
      <div class="mt-3 small text-muted-2">Didn't get it? <a href="#" onclick="event.preventDefault();toast('Code resent')">Resend code</a></div>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/site/js/data.js"></script>
<script src="/site/js/common.js"></script>
<script>
const pending = localStorage.getItem("lumen_pending_email");
if(pending) document.getElementById("email-ph").textContent = pending;
const inputs = document.querySelectorAll("#code-inputs input");
inputs.forEach((inp,i)=>{
  inp.addEventListener("input",e=>{
    e.target.value = e.target.value.replace(/\D/g,"");
    if(e.target.value && inputs[i+1]) inputs[i+1].focus();
  });
  inp.addEventListener("keydown",e=>{ if(e.key==="Backspace" && !e.target.value && inputs[i-1]) inputs[i-1].focus(); });
});
async function doVerify(){
  const code = Array.from(inputs).map(i=>i.value).join("");
  const btn = document.getElementById("btn"); btn.disabled = true; btn.textContent = "Verifying...";
  const res = await window.api.verifyCode(code);
  if(res.ok){ toast("Email verified! Please log in."); setTimeout(()=>location.href="/site/login.html", 900); }
  else { toast("Invalid code — try 123456 for the demo"); btn.disabled=false; btn.textContent="Verify"; }
}
</script>
</body>
</html>
