<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Register — Lumen Library</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/site/css/styles.css" rel="stylesheet"/>
</head>
<body>
<div id="navbar-mount"></div>
<div class="auth-shell">
  <div class="auth-card">
    <h2>Create your account.</h2>
    <div class="sub">Free forever. Takes about a minute.</div>
    <form onsubmit="event.preventDefault();doRegister(this)">
      <div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="fullName" required/></div>
      <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required/></div>
      <div class="row g-2 mb-3">
        <div class="col-6"><label class="form-label">Password</label><input class="form-control" type="password" name="pw" required minlength="6"/></div>
        <div class="col-6"><label class="form-label">Confirm</label><input class="form-control" type="password" name="pw2" required minlength="6"/></div>
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="news" name="news" checked/>
        <label class="form-check-label" for="news">Subscribe to our newsletter</label>
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="news" name="news" checked/>
        <label class="form-check-label" for="news">Subscribe to our newsletter</label>
      </div>
      <button class="btn btn-accent w-100">Create account</button>
    </form>
    <div class="text-center mt-3 small text-muted-2">Already have an account? <a href="/site/login.html">Log in</a></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/site/js/data.js"></script>
<script src="/site/js/common.js"></script>
<script>
async function doRegister(form){
  if(form.pw.value !== form.pw2.value){ toast("Passwords do not match"); return; }
  await window.api.register({ fullName:form.fullName.value, email:form.email.value, isSubscribed:form.news.checked });
  location.href = "/site/verify.html";
}
</script>
</body>
</html>
