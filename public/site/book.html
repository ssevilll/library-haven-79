<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Book — Lumen Library</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/site/css/styles.css" rel="stylesheet"/>
</head>
<body data-nav="books">
<div id="navbar-mount"></div>

<div class="container book-hero">
  <div id="book-mount"><div class="skeleton" style="height:400px"></div></div>
</div>

<div class="container section-tight">
  <div class="section-title"><h3 class="mb-0">Reviews</h3></div>
  <div id="reviews-mount"></div>
  <div id="review-form-mount" class="mt-4"></div>
</div>

<div class="container section">
  <div class="section-title"><h3 class="mb-0">More books like this</h3></div>
  <div class="row g-3" id="related-mount"></div>
</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/site/js/data.js"></script>
<script src="/site/js/common.js"></script>
<script>
(async function(){
  const id = new URLSearchParams(location.search).get("id");
  const book = await window.api.getBookById(id);
  if(!book){ document.getElementById("book-mount").innerHTML = emptyState("Book not found.","📕"); return; }
  document.title = `${book.title} — Lumen Library`;

  const user = window.api.currentUser();
  let borrowStatus = book.inStock ? "Available" : "Unavailable";
  // demo: simulate personal statuses
  const userStatus = user && id === "b2" ? "Pending your request" : (user && id === "b3" ? "Currently borrowed by you" : borrowStatus);

  const statusBadge = {
    "Available": '<span class="avail ok">Available</span>',
    "Unavailable": '<span class="avail no">Unavailable</span>',
    "Pending your request": '<span class="avail" style="background:#fff4d6;color:var(--warn)">Pending your request</span>',
    "Currently borrowed by you": '<span class="avail" style="background:var(--accent-50);color:var(--accent-600)">Currently borrowed by you</span>',
  }[userStatus];

  const addl = book.additionalImageUrls||[];
  document.getElementById("book-mount").innerHTML = `
  <div class="row g-5">
    <div class="col-md-4 text-center">
      <div class="book-cover-lg mx-auto zoom-cover"><img id="mainCover" src="${book.mainImageUrl}" alt=""/></div>
      ${addl.length ? `<div class="thumb-row mt-3">${
        [book.mainImageUrl, ...addl].map((u,i)=>`<button type="button" class="thumb ${i===0?'active':''}" data-src="${u}"><img src="${u}" alt=""/></button>`).join("")
      }</div>`:""}
    </div>
    <div class="col-md-8">
      <div class="eyebrow">${book.libraryName}</div>
      <h1 class="mt-2">${book.title}</h1>
      <div class="mb-3">by <a href="/site/books.html?q=${encodeURIComponent(book.authorName)}">${book.authorName}</a></div>
      <div>${book.genreNames.map(n=>`<span class="chip-genre">${n}</span>`).join("")}</div>
      <div class="d-flex align-items-center gap-3 mt-3">${starRow(book.rating)} ${statusBadge}</div>
      <p class="mt-4 text-muted-2" style="font-size:1.02rem;line-height:1.6">${book.description}</p>
      <dl class="row small text-muted-2 mt-3">
        <dt class="col-sm-3">Published</dt><dd class="col-sm-9">${fmtDate(book.publishedDate)}</dd>
        <dt class="col-sm-3">Pages</dt><dd class="col-sm-9">${book.pageCount}</dd>
        <dt class="col-sm-3">Language</dt><dd class="col-sm-9">${book.language}</dd>
      </dl>
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-accent px-4" onclick="requestBorrow('${book.id}')" ${!book.inStock?'disabled':''}>Borrow this book</button>
        <button class="btn btn-outline-accent" onclick="toast('Added to your Want to Read shelf')">♥ Save to shelf</button>
      </div>
    </div>
  </div>`;
  document.querySelectorAll(".thumb").forEach(t => t.addEventListener("click", () => {
    document.querySelectorAll(".thumb").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("mainCover").src = t.dataset.src;
  }));

  // reviews
  const reviews = await window.api.getReviewsForBook(book.id);
  document.getElementById("reviews-mount").innerHTML = reviews.length
    ? reviews.map(r=>`<div class="review-item">
        <div class="d-flex justify-content-between align-items-center">
          <div><strong>${r.author}</strong> <span class="text-muted-2 small">· ${fmtDate(r.date)}</span></div>
          <div>${starRow(r.rating)}</div>
        </div>
        <p class="mb-0 mt-2 text-muted-2">${r.text}</p>
      </div>`).join("")
    : emptyState("No reviews yet — be the first to write one.","✍️");

  // review form (only members who "borrowed & returned" — demo: shown when logged in)
  if(user){
    document.getElementById("review-form-mount").innerHTML = `
      <div class="card-lib p-4">
        <h5 class="mb-3">Write a review</h5>
        <div class="mb-3"><label class="form-label">Your rating</label>
          <select class="form-select" style="max-width:200px"><option>★★★★★ (5)</option><option>★★★★ (4)</option><option>★★★ (3)</option><option>★★ (2)</option><option>★ (1)</option></select>
        </div>
        <div class="mb-3"><label class="form-label">Your review</label>
          <textarea class="form-control" rows="4" placeholder="What did you think?"></textarea>
        </div>
        <button class="btn btn-accent" onclick="event.preventDefault();toast('Review submitted — thank you!')">Submit review</button>
      </div>`;
  } else {
    document.getElementById("review-form-mount").innerHTML = `<div class="text-muted-2 small">Log in to write a review (requires that you've borrowed and returned this title).</div>`;
  }

  // related
  const related = await window.api.getRelatedBooks(book);
  document.getElementById("related-mount").innerHTML = related.length
    ? related.map(b=>`<div class="col-6 col-sm-4 col-md-3 col-lg-2">${bookCard(b)}</div>`).join("")
    : `<div class="col-12">${emptyState("Nothing similar yet.","📖")}</div>`;
})();

function requestBorrow(id){
  const user = window.api.currentUser();
  if(!user){ toast("Please log in to borrow"); setTimeout(()=>location.href="/site/login.html",800); return; }
  toast("Borrow request sent — a librarian will review it shortly.");
}
</script>
</body>
</html>
