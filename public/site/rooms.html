<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Study Rooms — Lumen Library</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/site/css/styles.css" rel="stylesheet"/>
</head>
<body data-nav="rooms">
<div id="navbar-mount"></div>

<div class="container section-tight">
  <div class="eyebrow">Study Rooms</div>
  <h1 class="mt-1">Reserve a quiet corner.</h1>
  <p class="text-muted-2">Group rooms, media labs, and single-desk study spaces. All reservations are one hour long.</p>

  <div class="filter-panel mb-4" style="position:static">
    <div class="row g-3 align-items-end">
      <div class="col-md-3"><label class="form-label">Date</label><input type="date" class="form-control" id="f-date"/></div>
      <div class="col-md-3"><label class="form-label">Min capacity</label><input type="number" class="form-control" id="f-cap" min="1" placeholder="Any"/></div>
      <div class="col-md-4"><label class="form-label">Branch</label><select class="form-select" id="f-lib"><option value="">All branches</option></select></div>
      <div class="col-md-2 d-flex align-items-end"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="f-avail"/><label class="form-check-label" for="f-avail">Available only</label></div></div>
    </div>
    <div class="mt-3">
      <label class="form-label small fw-semibold">Amenities</label>
      <div class="amenity-list" id="f-amen"></div>
    </div>
    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-accent" onclick="refresh()">Apply</button>
      <button class="btn btn-ghost" onclick="reset()">Reset</button>
    </div>
  </div>

  <div class="row g-3" id="rooms-mount"></div>
</div>

<div class="modal fade" id="reserve-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="rv-title">Reserve room</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-3" style="max-width:220px"><label class="form-label">Date</label><input type="date" class="form-control" id="rv-date"/></div>
        <div class="mb-2 small text-muted-2">Pick an available one-hour slot:</div>
        <div class="slot-grid" id="rv-slots"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-accent" id="rv-confirm" disabled onclick="confirmReserve()">Confirm reservation</button>
      </div>
    </div>
  </div>
</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/site/js/data.js"></script>
<script src="/site/js/common.js"></script>
<script>
const AMENITIES = ["Wi-Fi","Whiteboard","TV Screen","Power","Recording","Projector"];

async function init(){
  const libs = await window.api.getLibraries();
  document.getElementById("f-lib").innerHTML += libs.map(l=>`<option value="${l.id}">${l.name}</option>`).join("");
  document.getElementById("f-amen").innerHTML = AMENITIES.map(a=>`<label><input type="checkbox" value="${a}"/> ${a}</label>`).join("");
  const p = new URLSearchParams(location.search);
  if(p.get("libraryId")) document.getElementById("f-lib").value = p.get("libraryId");
  document.getElementById("f-date").valueAsDate = new Date();
  refresh();
}
function reset(){
  document.getElementById("f-cap").value="";
  document.getElementById("f-lib").value="";
  document.getElementById("f-avail").checked=false;
  document.querySelectorAll("#f-amen input").forEach(c=>c.checked=false);
  refresh();
}
function selectedAmenities(){ return Array.from(document.querySelectorAll("#f-amen input:checked")).map(c=>c.value); }

async function refresh(){
  const mount = document.getElementById("rooms-mount");
  mount.innerHTML = `<div class="col-12"><div class="skeleton" style="height:120px"></div></div>`;
  let rooms = await window.api.getRooms({
    libraryId: document.getElementById("f-lib").value,
    minCapacity: +document.getElementById("f-cap").value || null,
    availableOnly: document.getElementById("f-avail").checked,
  });
  const amen = selectedAmenities();
  if(amen.length) rooms = rooms.filter(r => amen.every(a => (r.amenities||[]).includes(a)));
  if(!rooms.length){ mount.innerHTML = `<div class="col-12">${emptyState("No rooms match your filters.","🪑")}</div>`; return; }
  mount.innerHTML = rooms.map(r => {
    const busyIdx = (r.name.length + r.capacity) % 7;
    const days = ["M","T","W","T","F","S","S"].map((d,i)=>`<div class="day ${i===busyIdx || i===(busyIdx+3)%7 ? 'busy':'free'}">${d}</div>`).join("");
    return `<div class="col-md-6">
      <div class="card-lib room-card">
        <div class="room-thumb">🪑</div>
        <div class="flex-grow-1">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <h5 class="mb-0">${r.name}</h5>
              <div class="text-muted-2 small">${r.libraryName} · seats ${r.capacity}</div>
            </div>
            <span class="avail ${r.isAvailable?'ok':'no'}">${r.isAvailable?'Available':'Unavailable'}</span>
          </div>
          <div class="mt-2">${r.amenities.map(a=>`<span class="chip">${a}</span>`).join("")}</div>
          <div class="week-preview">${days}</div>
          <div class="mt-3"><button class="btn btn-accent btn-sm" ${!r.isAvailable?'disabled':''} onclick="openReserve('${r.id}','${r.name.replace(/'/g,"\\'")}')">Reserve</button></div>
        </div>
      </div></div>`;
  }).join("");
}

let currentRoom = null, selectedSlot = null;
function renderSlots(roomId){
  // deterministic "busy" slots per room+date
  const dateStr = document.getElementById("rv-date").value || "";
  const seed = (roomId+dateStr).split("").reduce((a,c)=>a+c.charCodeAt(0),0);
  const slots = [];
  for(let h=8; h<22; h++){
    const busy = ((seed + h*7) % 5) === 0;
    slots.push({ label:`${String(h).padStart(2,"0")}:00 – ${String(h+1).padStart(2,"0")}:00`, hour:h, busy });
  }
  document.getElementById("rv-slots").innerHTML = slots.map(s =>
    `<button type="button" class="slot-btn" data-h="${s.hour}" ${s.busy?'disabled title="Already booked"':''}>${s.label}</button>`
  ).join("");
  selectedSlot = null;
  document.getElementById("rv-confirm").disabled = true;
  document.querySelectorAll("#rv-slots .slot-btn").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll("#rv-slots .slot-btn").forEach(x=>x.classList.remove("selected"));
    b.classList.add("selected");
    selectedSlot = +b.dataset.h;
    document.getElementById("rv-confirm").disabled = false;
  }));
}
function openReserve(id, name){
  currentRoom = id;
  document.getElementById("rv-title").textContent = `Reserve ${name}`;
  document.getElementById("rv-date").valueAsDate = new Date();
  renderSlots(id);
  document.getElementById("rv-date").onchange = ()=>renderSlots(id);
  new bootstrap.Modal(document.getElementById("reserve-modal")).show();
}
function confirmReserve(){
  bootstrap.Modal.getInstance(document.getElementById("reserve-modal")).hide();
  toast(`Reservation requested for ${String(selectedSlot).padStart(2,"0")}:00 — pending librarian confirmation.`);
}

init();
</script>
</body>
</html>
