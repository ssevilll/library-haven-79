<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Announcements — Lumen Library</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/site/css/styles.css" rel="stylesheet"/>
</head>
<body data-nav="announcements">
<div id="navbar-mount"></div>

<div class="container section-tight" style="max-width:820px">
  <div class="eyebrow">Announcements</div>
  <h1 class="mt-1">What's happening across our branches.</h1>
  <div class="d-flex flex-column gap-3 mt-4" id="list"></div>
</div>

<div class="modal fade" id="ann-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="ann-title"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="text-muted-2 small mb-3" id="ann-meta"></div>
        <p id="ann-body" style="line-height:1.7"></p>
      </div>
    </div>
  </div>
</div>

<div id="footer-mount"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/site/js/data.js"></script>
<script src="/site/js/common.js"></script>
<script>
let ANNS = [];
(async function(){
  ANNS = await window.api.getAnnouncements();
  const list = document.getElementById("list");
  if(!ANNS.length){ list.innerHTML = emptyState("No announcements yet.","📣"); return; }
  list.innerHTML = ANNS.map(a=>`
    <div class="announce-card" onclick="openAnn('${a.id}')">
      <div class="d-flex justify-content-between align-items-start gap-3">
        <div>
          <h5 class="mb-1">${a.title}</h5>
          <div class="meta">${a.publisher} · ${fmtDate(a.announceDate)}</div>
          <p class="mt-2 mb-0 text-muted-2">${a.content.slice(0,120)}${a.content.length>120?'…':''}</p>
        </div>
        ${a.isImportant?'<span class="badge-important">Important</span>':''}
      </div>
    </div>`).join("");
})();
function openAnn(id){
  const a = ANNS.find(x=>x.id===id);
  document.getElementById("ann-title").textContent = a.title;
  document.getElementById("ann-meta").textContent = `${a.publisher} · ${fmtDate(a.announceDate)}`;
  document.getElementById("ann-body").textContent = a.content;
  new bootstrap.Modal(document.getElementById("ann-modal")).show();
}
</script>
</body>
</html>
