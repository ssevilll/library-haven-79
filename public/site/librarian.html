<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Librarian Panel — Lumen Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/site/css/styles.css"/>
</head>
<body>
  <div class="admin-topbar">
    <button class="btn btn-ghost btn-sm" id="sideToggle">☰ Menu</button>
    <span class="brand">Lumen<span style="color:var(--accent)">.</span>Librarian</span>
    <span></span>
  </div>
  <div class="admin-scrim" id="scrim"></div>

  <div class="admin-shell">
    <aside class="admin-sidebar" id="sidebar">
      <a class="brand" href="#overview">Lumen<span class="dot">.</span>Librarian</a>
      <div class="px-3 pb-2 small" style="color:#8fb4b8" id="branchLabel">Loading branch…</div>

      <div class="side-section">Analytics</div>
      <a class="side-link" data-pane="overview" href="#overview"><span class="side-ico">📊</span> Overview</a>

      <div class="side-section">My Branch</div>
      <a class="side-link" data-pane="books"        href="#books"><span class="side-ico">📚</span> Books</a>
      <a class="side-link" data-pane="members"      href="#members"><span class="side-ico">👥</span> Members</a>
      <a class="side-link" data-pane="rooms"        href="#rooms"><span class="side-ico">🚪</span> Rooms</a>

      <div class="side-section">Operations</div>
      <a class="side-link" data-pane="borrowings"   href="#borrowings"><span class="side-ico">📖</span> Borrowings</a>
      <a class="side-link" data-pane="reservations" href="#reservations"><span class="side-ico">📅</span> Reservations</a>

      <div class="side-section">Personal</div>
      <a class="side-link" data-pane="salary"       href="#salary"><span class="side-ico">💰</span> My Salary</a>

      <div class="side-section">Session</div>
      <a class="side-link" href="/site/index.html"><span class="side-ico">↩</span> Back to Site</a>
      <a class="side-link" href="#" id="logoutBtn"><span class="side-ico">⎋</span> Logout</a>
    </aside>

    <main class="admin-main">
      <div id="paneMount"></div>
    </main>
  </div>

  <div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="formModalTitle">Edit</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="formModalBody"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-accent" id="formModalSave">Save</button>
      </div>
    </div></div>
  </div>

  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Confirm</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><p id="confirmMsg">Are you sure?</p></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger" id="confirmYes">Confirm</button>
      </div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/site/js/data.js"></script>
  <script src="/site/js/common.js"></script>
  <script src="/site/js/librarian.js"></script>
</body>
</html>
