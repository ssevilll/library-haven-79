<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Log in — Lumen Library</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/site/css/styles.css" rel="stylesheet"/>
</head>
<body>
<div id="navbar-mount"></div>
<div class="auth-shell">
  <div class="auth-card">
    <h2>Welcome back.</h2>
    <div class="sub">Log in to keep reading where you left off.</div>
    <form onsubmit="event.preventDefault();doLogin(this)">
      <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required placeholder="you@example.com"/></div>
      <div class="mb-2"><label class="form-label">Password</label><input class="form-control" type="password" name="pw" required placeholder="••••••••"/></div>
      <div class="text-end mb-3"><a href="/site/forgot.html" class="small">Forgot password?</a></div>
      <button class="btn btn-accent w-100" id="btn">Log in</button>
    </form>
    <div class="text-center mt-3 small text-muted-2">Don't have an account? <a href="/site/register.html">Register</a></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/site/js/data.js"></script>
<script src="/site/js/common.js"></script>
<script>
async function doLogin(form){
  const btn = document.getElementById("btn");
  btn.disabled = true; btn.textContent = "Signing in...";
  const res = await window.api.login(form.email.value, form.pw.value);
  if(res.ok){
    toast("Welcome back!");
    setTimeout(()=>location.href="/site/index.html", 900);
  }
}
</script>
</body>
</html>
